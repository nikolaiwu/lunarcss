# Publishes to npm and creates a GitHub release when a version tag (v*) is pushed.
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed. Configure
# the trusted publisher once on npmjs.com: package settings → Trusted Publisher →
# GitHub Actions, repository nikolaiwu/lunarcss, workflow release.yml.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build

      # Skipped if this version is already on npm (e.g. published manually, or a re-run)
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, skipping"
          else
            npm publish --provenance
          fi

      # The fonts stylesheet needs its fonts/ folder next to it, so bundle them in a zip
      - name: Package release assets
        run: |
          cd dist
          zip -r "../lunarcss-$GITHUB_REF_NAME.zip" lunarcss.min.css lunarcss-fonts.min.css fonts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/lunarcss.min.css "lunarcss-$GITHUB_REF_NAME.zip")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
